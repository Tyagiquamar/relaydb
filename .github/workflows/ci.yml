name: relaydb-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.26'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 5m

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relaydb
          POSTGRES_PASSWORD: relaydb
          POSTGRES_DB: relaydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests
        run: go test -v -race ./...

      - name: Run integration tests
        run: go test -v -race -tags=integration ./tests/integration/...
        env:
          RELAYDB_METADATA_DB_URL: postgres://relaydb:relaydb@localhost:5432/relaydb?sslmode=disable

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binaries
        run: |
          go build -o bin/ ./cmd/...

      - name: Build Docker images
        run: |
          docker compose build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose config --quiet

      - name: Start services
        run: docker compose up -d --wait

      - name: Check health
        run: |
          sleep 5
          curl -f http://localhost:8080/health/live || exit 1
          curl -f http://localhost:8080/health/ready || exit 1

      - name: Stop services
        if: always()
        run: docker compose down