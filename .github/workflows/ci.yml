name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Vet + full suite, including the testcontainers logical-replication e2e
      # and the webhook delivery failure scenes (Docker is preinstalled on the
      # runner).
      - name: Verify
        run: make verify

  go-race:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Full suite under the race detector. Needs CGO + a C toolchain;
      # ubuntu runners ship gcc. Ryuk disabled: testcontainers-go v0.44.0
      # has a library-internal reaper startup race (reaperSpawner.
      # reuseOrCreate) that -race flags; tests terminate containers
      # explicitly, so the safety net isn't needed for correctness.
      - name: Race detector
        run: make race
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Enforces .golangci.yml; failures fail the build (no || true).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -f Dockerfile .

      - name: Build demo image
        run: docker build -f Dockerfile.demo .

      - name: Validate compose configuration
        run: docker compose config
