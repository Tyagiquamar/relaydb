version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - gosec
    - unconvert
    - gocritic

  settings:
    gocritic:
      # diagnostic + performance carry defect signal; experimental/style
      # (paramTypeCombine, importShadow, ...) are review-level nitpicks.
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - whyNoLint
        - hugeParam
        # CLI mains legitimately log.Fatal after deferring connection cleanup;
        # process teardown releases the resources regardless.
        - exitAfterDefer

    gosec:
      excludes:
        - G101 # Potential hardcoded credentials (we have env vars)
        - G304 # File path from variable (we control our paths)

  exclusions:
    rules:
      # Test files: security/style scanners produce noise on fixtures/helpers.
      - path: _test\.go
        linters:
          - gosec
          - gocritic
          - errcheck
      # Partition hashing intentionally truncates 64-bit hashes to uint32
      # bucket indexes; LSN/XID math relies on bounded wraps. Reviewed callsites.
      - text: "G115"
        linters:
          - gosec
      # Internal/demo HTTP frontends sit behind reverse proxies; strict
      # server timeouts would need endpoint-by-endpoint tuning. Tracked gap.
      - text: "G114"
        linters:
          - gosec

formatters:
  enable:
    - gofmt

issues:
  # Maximum issue count per linter
  max-issues-per-linter: 0
  # Maximum issue count per file
  max-same-issues: 0
