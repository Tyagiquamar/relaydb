version: '3.9'

name: relaydb

services:
  # Source PostgreSQL (where we capture changes from)
  source-postgres:
    build:
      context: ./docker/postgres
    environment:
      POSTGRES_USER: relaydb
      POSTGRES_PASSWORD: relaydb
      POSTGRES_DB: commerce
    ports:
      - "5432:5432"
    volumes:
      - source-data:/var/lib/postgresql/data
      - ./examples/commerce/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaydb -d commerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Metadata PostgreSQL (where RelayDB stores events, checkpoints, offsets)
  metadata-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relaydb
      POSTGRES_PASSWORD: relaydb
      POSTGRES_DB: relaydb
    ports:
      - "5433:5432"
    volumes:
      - metadata-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaydb -d relaydb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # RelayDB API server
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      RELAYDB_SERVICE: api
      RELAYDB_HTTP_ADDR: :8080
      RELAYDB_GRPC_ADDR: :9090
      RELAYDB_METADATA_DB_URL: postgres://relaydb:relaydb@metadata-postgres:5432/relaydb?sslmode=disable
      RELAYDB_ADMIN_KEY_ID: admin
      RELAYDB_ADMIN_KEY: ${RELAYDB_ADMIN_KEY:-dev-admin-key-change-in-production}
      RELAYDB_READER_KEY_ID: reader
      RELAYDB_READER_KEY: ${RELAYDB_READER_KEY:-dev-reader-key-change-in-production}
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      metadata-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Capture service (primary)
  capture-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: capture
    environment:
      RELAYDB_SERVICE: capture
      RELAYDB_METADATA_DB_URL: postgres://relaydb:relaydb@metadata-postgres:5432/relaydb?sslmode=disable
      RELAYDB_SOURCE_DB_URL: postgres://relaydb:relaydb@source-postgres:5432/commerce?replication=database
      RELAYDB_CAPTURE_OWNER_ID: capture-1
      RELAYDB_METRICS_ADDR: :2112
      RELAYDB_MASTER_KEY: ${RELAYDB_MASTER_KEY:-MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
    depends_on:
      source-postgres:
        condition: service_healthy
      metadata-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # Capture service (standby for HA demo)
  capture-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: capture
    environment:
      RELAYDB_SERVICE: capture
      RELAYDB_METADATA_DB_URL: postgres://relaydb:relaydb@metadata-postgres:5432/relaydb?sslmode=disable
      RELAYDB_SOURCE_DB_URL: postgres://relaydb:relaydb@source-postgres:5432/commerce?replication=database
      RELAYDB_CAPTURE_OWNER_ID: capture-2
      RELAYDB_METRICS_ADDR: :2112
      RELAYDB_MASTER_KEY: ${RELAYDB_MASTER_KEY:-MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
    depends_on:
      source-postgres:
        condition: service_healthy
      metadata-postgres:
        condition: service_healthy
    profiles:
      - ha  # Only start with: docker compose --profile ha up

  # Webhook delivery service
  delivery:
    build:
      context: .
      dockerfile: Dockerfile
      target: delivery
    environment:
      RELAYDB_SERVICE: delivery
      RELAYDB_METADATA_DB_URL: postgres://relaydb:relaydb@metadata-postgres:5432/relaydb?sslmode=disable
      RELAYDB_METRICS_ADDR: :2112
      RELAYDB_MASTER_KEY: ${RELAYDB_MASTER_KEY:-MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
    depends_on:
      metadata-postgres:
        condition: service_healthy

  # Dashboard (Next.js) — proxies /api/v1/* to the api service server-side (BFF)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    environment:
      RELAYDB_API_URL: http://api:8080
      RELAYDB_READER_KEY_ID: reader
      RELAYDB_READER_KEY: ${RELAYDB_READER_KEY:-dev-reader-key-change-in-production}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-feature=native-histograms'
    ports:
      - "9091:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
      - capture-1
      - delivery

  # Demo commerce app (generates load)
  demo-commerce:
    build:
      context: .
      dockerfile: Dockerfile
      target: demo-commerce
    environment:
      RELAYDB_SOURCE_DB_URL: postgres://relaydb:relaydb@source-postgres:5432/commerce
    depends_on:
      source-postgres:
        condition: service_healthy
    profiles:
      - demo

volumes:
  source-data:
  metadata-data:
  prometheus-data: