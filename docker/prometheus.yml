global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'relaydb-api'
    static_configs:
      - targets: ['api:2112']
    metrics_path: '/metrics'

  - job_name: 'relaydb-capture'
    static_configs:
      - targets: ['capture-1:2112', 'capture-2:2112']
    metrics_path: '/metrics'

  - job_name: 'relaydb-delivery'
    static_configs:
      - targets: ['delivery:2112']
    metrics_path: '/metrics'